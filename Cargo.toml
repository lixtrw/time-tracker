[package]
name = "time_tr"
version = "0.1.0"
edition = "2024"

[dependencies]
color-eyre = "0.6.5"
dirs = "7.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ['derive'] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
