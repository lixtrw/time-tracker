[package]
name = "tmtr_activity_plugin"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib", "dylib"]

[dependencies]
tmtr_api = { path = "../tmtr_api/" }
anyhow = "1.0.104"

[features]
dynamic = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
strip = true
